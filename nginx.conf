server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Не кэшируем сам index.html и config.js агрессивно — иначе после
    # редеплоя пользователи могут долго видеть старую версию.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /config.js {
        add_header Cache-Control "no-cache";
    }

    # SPA: любой путь, которого нет как файла — отдаём index.html,
    # чтобы React Router сам разобрался с маршрутом на клиенте.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
